<h2 mat-dialog-title>Assign permissions &mdash; {{ data.role.name }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Permissions</mat-label>
      <mat-select formControlName="permissions" multiple>
        @for (permission of data.permissions; track permission.id) {
          <mat-option [value]="permission.name">{{ permission.name }}</mat-option>
        }
      </mat-select>
      @if (form.controls.permissions.hasError('required')) {
        <mat-error>Select at least one permission</mat-error>
      }
    </mat-form-field>
  </form>

  @if (errorMessage()) {
    <div class="dialog-error">{{ errorMessage() }}</div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Save
    }
  </button>
</mat-dialog-actions>
