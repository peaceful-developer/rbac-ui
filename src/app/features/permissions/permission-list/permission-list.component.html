<div class="page">
  <div class="page-header">
    <h1>Permissions</h1>
    <button mat-flat-button color="primary" (click)="createPermission()" *appHasPermission="'MASTER_ADMIN'">
      <mat-icon>add</mat-icon>
      New permission
    </button>
  </div>

  <div class="table-card mat-elevation-z1">
    @if (loading()) {
      <div class="loading-row">
        <mat-spinner diameter="32"></mat-spinner>
      </div>
    } @else if (permissions().length === 0) {
      <div class="empty-state">
        <mat-icon>key_off</mat-icon>
        <span>No permissions found.</span>
      </div>
    } @else {
      <table mat-table [dataSource]="permissions()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let permission"><strong>{{ permission.name }}</strong></td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let permission">{{ permission.description || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
          <td mat-cell *matCellDef="let permission" class="actions-cell">
            <button
              mat-icon-button
              matTooltip="Delete"
              aria-label="Delete"
              color="warn"
              (click)="deletePermission(permission)"
              *appHasPermission="'MASTER_ADMIN'"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </div>
</div>
